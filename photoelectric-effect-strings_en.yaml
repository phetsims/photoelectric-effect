# Screens
screen:
  intro:      'Intro'
  experiment: 'Experiment'
  energy:     'Energy'

materials:
  sodium:   'Sodium'
  copper:   'Copper'
  calcium:  'Calcium'
  platinum: 'Platinum'
  zinc:     'Zinc'
  custom:   'Custom'
  mystery:  'Mystery'
  mystery1: 'Mystery 1'
  mystery2: 'Mystery 2'
  mystery3: 'Mystery 3'
  mystery4: 'Mystery 4'
  mystery5: 'Mystery 5'

# Experiment graphs
experiment:
  graph:
    voltageCurrentTitle:                      'Voltage vs. Current'
    intensityCurrentTitle:                    'Intensity vs. Current'
    frequencyEnergyTitle:                     'Frequency vs. Energy'
    actionButton:                             'Graph action'
    voltageAxisLabel:                         'Voltage (V)'
    currentAxisLabel:                         'Current (μA)'
    intensityAxisLabel:                       'Intensity (%)'
    frequencyAxisLabel:                       'Frequency (x10<sup>15</sup> Hz)'
    energyAxisLabel:                          'Electron KE<sub>max</sub> (ev)'

    # Just placeholders
    snapshotsDialogTitle:                     'Saved snapshots'
    snapshotSaved:                            'Saved!'
    materialLabel:                            'Material'
    snapshotLabelValuePattern:                '{{label}}: {{value}}'
    snapshotsGalleryButtonAccessibleName:     'View saved snapshots'
