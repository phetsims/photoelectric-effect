photonQuantity:
  single: 'Single'
  burst:  'Burst'
  fire:   'Fire'

# Energy graphs
energy:
  graph:
    yAxisLabel:        'Energy (eV)'
    fermiLevelLabel:   'Fermi Level'
    noElectronEjected: 'No electron ejected'
    diagramControls:
      label:        'Label'
      workFunction: 'Work Function'
      photonArrow:  'Photon Arrow'
    legend:
      potentialEnergy: 'Potential Energy'
      photonEnergy:    'Photon Energy'
      kineticEnergy:   'Kinetic Energy'
      emptyStates:     'Empty States'
      filledStates:    'Filled States'

showElectrons:                      'Show Electrons'
highestEnergyOnly:                  'Highest Energy Only'

spectrumTrack:
  uvLabel: 'UV'
  irLabel: 'IR'

workFunction.label:                 'Work Function (eV)'
intensity.label:                    'Intensity'
intensity.percentReadoutPattern:    '{{value}} %'
photonRate.label:                   'Photon Rate'
sourceOutput.percentReadoutPattern: '{{value}} %'
wavelength.label:                   'Wavelength (nm)'
wavelength.valueReadoutPattern:     '{{value}} nm'
voltage.label:                      'Voltage'
voltage.valueReadoutPattern:        '{{value}} V'
current.label:                      'Current'

units:
  microamperes:
    symbol:        μA
    symbolPattern: '{{value}} μA'

preferences:
  showPhotons:
    label: 'Show photons'
    description: 'Light source emits photons'
  mysteryMaterial:
    label:       'Add Second mystery material'
    description: 'Additional target material option with customizable work function value.'

a11y:

  units:
    microamperes:
      pattern: |-
               { $value ->
                 [one] { $value } microampere
                 *[other] { $value } microamperes
               }

  # Intro screen summary
  introScreen:
    screenSummary:
      playArea:        >-
                       PLACEHOLDER In the play area, there is a light source that shines photons onto a metal target.
                       Choose a target material and adjust the light's intensity and wavelength to explore the photoelectric effect.
                       Toggle between a circuit and grounded representation.
      controlArea:     >-
                       PLACEHOLDER In the control area, there are options to show electrons and display only the highest energy electrons.
                       There are also time controls and a button to reset the simulation.
      currentDetails:
        leadingParagraph: 'Currently:'
      interactionHint: PLACEHOLDER Choose a material and adjust the wavelength to start exploring.

  # Experiment screen summary
  experimentScreen:
    screenSummary:
      playArea:        >-
                       PLACEHOLDER In the play area, there is a light source that shines photons onto a metal target.
                       Choose a target material and adjust the light's intensity and wavelength.
                       A voltage control sets the battery voltage across the circuit.
                       Three graphs show relationships between intensity, frequency, and voltage versus current.
      controlArea:     >-
                       PLACEHOLDER In the control area, there are options to show electrons and display only the highest energy electrons.
                       There are also time controls and a button to reset the simulation.
      currentDetails:
        leadingParagraph: 'Currently:'
      interactionHint: PLACEHOLDER Choose a material and adjust the wavelength to start exploring.

  # Photon source panel and its inner controls
  photonSourcePanel:
    accessibleHeading: PLACEHOLDER Photon Source
    intensitySlider:
      accessibleName: PLACEHOLDER Intensity
    wavelengthNumberControl:
      accessibleName: PLACEHOLDER Wavelength

  # Ammeter current readout
  ammeterDisplayPanel:
    accessibleName: PLACEHOLDER Ammeter

  # Material selection
  materialsComboBox:
    accessibleName: PLACEHOLDER Material

  # Intro screen: representation toggle
  representationRadioButtonGroup:
    accessibleName: PLACEHOLDER Representation
    groundedRadioButton:
      accessibleName: PLACEHOLDER Grounded
    circuitRadioButton:
      accessibleName: PLACEHOLDER Circuit

  # Experiment screen: battery voltage control
  voltageNumberControl:
    accessibleName: PLACEHOLDER Voltage

  # Experiment screen: graphs
  intensityCurrentGraphNode:
    accessibleHeading: PLACEHOLDER Intensity vs Current Graph
    expandCollapseButton:
      accessibleName: PLACEHOLDER expand/collapse
    cameraButton:
      accessibleName: PLACEHOLDER Save Snapshot
    trashButton:
      accessibleName: PLACEHOLDER Clear Snapshots
    snapshotsGalleryButton:
      accessibleName:     PLACEHOLDER View saved snapshots
      accessibleHelpText: PLACEHOLDER Opens a dialog with a plot of each saved snapshot.
  frequencyEnergyGraphNode:
    accessibleHeading: PLACEHOLDER Frequency vs Energy Graph
    expandCollapseButton:
      accessibleName: PLACEHOLDER expand/collapse
    cameraButton:
      accessibleName: PLACEHOLDER Save Snapshot
    trashButton:
      accessibleName: PLACEHOLDER Clear Snapshots
    snapshotsGalleryButton:
      accessibleName:     PLACEHOLDER View saved snapshots
      accessibleHelpText: PLACEHOLDER Opens a dialog with a plot of each saved snapshot.
  voltageCurrentGraphNode:
    accessibleHeading: PLACEHOLDER Voltage vs Current Graph
    expandCollapseButton:
      accessibleName: PLACEHOLDER expand/collapse
    cameraButton:
      accessibleName: PLACEHOLDER Save Snapshot
    trashButton:
      accessibleName: PLACEHOLDER Clear Snapshots
    snapshotsGalleryButton:
      accessibleName:     PLACEHOLDER View saved snapshots
      accessibleHelpText: PLACEHOLDER Opens a dialog with a plot of each saved snapshot.



    # TODO: @design What should these be?
    workFunction:
      label:       'Mystery Material Work Function (eV)'
      description: 'Set the work function of the mystery material.'
  photonMode:
    label:       'Normalize intensity'
    description: 'When intensity is normalized, number of photons emitted is independent of photon wavelength.'
