a11y:

  # Intro screen summary
  introScreen:
    screenSummary:
      playArea:        >-
                       A light source shines light onto a metal target. Adjust the intensity and wavelength of the light, and
                       choose the target material, to explore when light ejects electrons from the metal. A representation
                       toggle switches between a Grounded target and a full Circuit with an ammeter that reads the current.
      controlArea:     >-
                       Show or hide the ejected electrons, and choose to show only the highest energy electrons. Time controls
                       let you pause, step, or restart the action, and Reset All returns the simulation to its starting state.
      currentDetails:
        leadingParagraph: >-
                          Currently,
                          
                            The target material is MATERIAL.
                            The representation is set to REPRESENTATION.
                            Light source intensity is INTENSITY percent.
                            Wavelength is WAVELENGTH nanometers, in the SPECTRUMREGION part of the spectrum.
                            Electron emission is EMISSIONSTATE.
      interactionHint: Turn up the light source intensity, then adjust the wavelength to find when electrons start to fly off the metal.

  # Experiment screen summary
  experimentScreen:
    screenSummary:
      playArea:        >-
                       A light source shines light onto a metal target inside a circuit. Adjust the intensity and wavelength of
                       the light, choose the target material, and set the battery voltage across the plates to explore what
                       affects the current and the energy of the ejected electrons. Three graphs plot intensity versus current,
                       frequency versus electron energy, and voltage versus current, and you can capture snapshots to compare
                       experiments.
      controlArea:     >-
                       Show or hide the ejected electrons, and choose to show only the highest energy electrons. Time controls
                       let you pause, step, or restart the action, and Reset All returns the simulation to its starting state.
      currentDetails:
        leadingParagraph: >-
                          Currently,
                          
                            The target material is MATERIAL.
                            Light source intensity is INTENSITY percent.
                            Wavelength is WAVELENGTH nanometers, in the SPECTRUMREGION part of the spectrum.
                            Battery voltage is VOLTAGE volts.
                            Electron emission is EMISSIONSTATE.
                            The ammeter reads CURRENT.
      interactionHint: Turn up the light source intensity and adjust the wavelength, voltage, and material to start collecting data in the graphs.

  # Photon source panel and its inner controls
  photonSourcePanel:
    accessibleHeading: Light Source
    intensitySlider:
      accessibleName: Intensity
    wavelengthNumberControl:
      accessibleName: Wavelength

  # Ammeter current readout
  ammeterDisplayPanel:
    accessibleName: Ammeter

  # Material selection
  materialsComboBox:
    accessibleName: Target Material

  # Intro screen: representation toggle
  representationRadioButtonGroup:
    accessibleName: Representation
    groundedRadioButton:
      accessibleName: Grounded
    circuitRadioButton:
      accessibleName: Circuit

  # Experiment screen: battery voltage control
  voltageNumberControl:
    accessibleName: Battery Voltage

  # Experiment screen: graphs
  referenceLine:
    accessibleName:     Reference Line
    accessibleHelpText: Move across the stacked graphs to compare values at the same position.
  intensityCurrentGraphNode:
    accessibleHeading: Intensity vs. Current Graph
    expandCollapseButton:
      accessibleName: Intensity vs. Current
    cameraButton:
      accessibleName: Save Snapshot, Intensity vs. Current
    trashButton:
      accessibleName: Clear Snapshots, Intensity vs. Current
    snapshotsGalleryButton:
      accessibleName:     View Snapshots, Intensity vs. Current
      accessibleHelpText: Compare your saved snapshots of this graph side by side.
  frequencyEnergyGraphNode:
    accessibleHeading: Frequency vs. Energy Graph
    expandCollapseButton:
      accessibleName: Frequency vs. Energy
    cameraButton:
      accessibleName: Save Snapshot, Frequency vs. Energy
    trashButton:
      accessibleName: Clear Snapshots, Frequency vs. Energy
    snapshotsGalleryButton:
      accessibleName:     View Snapshots, Frequency vs. Energy
      accessibleHelpText: Compare your saved snapshots of this graph side by side.
  voltageCurrentGraphNode:
    accessibleHeading: Voltage vs. Current Graph
    expandCollapseButton:
      accessibleName: Voltage vs. Current
    cameraButton:
      accessibleName: Save Snapshot, Voltage vs. Current
    trashButton:
      accessibleName: Clear Snapshots, Voltage vs. Current
    snapshotsGalleryButton:
      accessibleName:     View Snapshots, Voltage vs. Current
      accessibleHelpText: Compare your saved snapshots of this graph side by side.



    # TODO: @design What should these be?
